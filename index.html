<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Het Kastje">
<title>Het Kastje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%AB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" sizes="180x180" href="./webapp-het-kastje.png"><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --paper:#F2F4F1; --card:#FFFFFF; --ink:#17252B; --muted:#5B6A70; --line:#DDE3DF; --line-strong:#B9C4BE;
  --accent:#2F4B9A; --accent-ink:#FFFFFF; --accent-soft:#E4EAF8;
  --warn:#B76A00; --warn-soft:#FFF0D6; --bad:#B3261E; --bad-soft:#FBE4E2; --ok:#2B7A4B; --ok-soft:#E1F2E7;
  --radius:14px;
  --font-d:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-b:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#111619; --card:#192024; --ink:#E7EDEF; --muted:#9AA8AE; --line:#2A343A; --line-strong:#43515A;
    --accent:#9DB4F5; --accent-ink:#0E1630; --accent-soft:#22304F;
    --warn:#F0B35A; --warn-soft:#3A2C12; --bad:#F29A93; --bad-soft:#3E1D1A; --ok:#7BCB9A; --ok-soft:#18301F;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
/* each tab has its own main colour */
body[data-view=recepten]{--accent:#C2492F;--accent-soft:#FBE6E0}
body[data-view=koken]{--accent:#B03A6F;--accent-soft:#F8E3EC}
body[data-view=lijst]{--accent:#2E7D4F;--accent-soft:#DFF1E6}
body[data-view=voorraad]{--accent:#2F4B9A;--accent-soft:#E4EAF8}
body[data-view=meer]{--accent:#4A5A63;--accent-soft:#E6EBEE}
@media (prefers-color-scheme:dark){
  body[data-view=recepten]{--accent:#F29A84;--accent-ink:#3B1209;--accent-soft:#3D2019}
  body[data-view=koken]{--accent:#EE9BBC;--accent-ink:#3A0F22;--accent-soft:#3F1D2E}
  body[data-view=lijst]{--accent:#7BCB9A;--accent-ink:#0E2A19;--accent-soft:#17321F}
  body[data-view=voorraad]{--accent:#9DB4F5;--accent-ink:#0E1630;--accent-soft:#22304F}
  body[data-view=meer]{--accent:#A9BAC4;--accent-ink:#12181C;--accent-soft:#27313A}
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--font-b);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--font-d);margin:0;letter-spacing:-.01em}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:var(--paper);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:2px solid var(--accent)}
.top .wrap{display:flex;align-items:center;gap:12px;position:relative}
.top .ttl{min-width:0;flex:1}
.section .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.section .actions .btn{flex:1 1 0;min-width:max-content}
.top nav.meernav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding-top:6px;padding-bottom:0}
.meernav button{background:none;border:0;border-radius:10px;padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;font-size:.7rem;font-weight:600;color:var(--muted);min-height:50px;min-width:0}
.meernav button svg{width:22px;height:22px}
.meernav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meernav button[aria-current=true]{color:var(--accent);background:var(--accent-soft)}
.msec{scroll-margin-top:calc(var(--hdr,86px) + 8px)}
.msec>h2.group:first-child{margin-top:4px}
.top h1{font-size:1.35rem;font-weight:700;color:var(--accent)}
.topadd{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;line-height:1;display:grid;place-items:center;padding:0 0 3px}
.top .sub{color:var(--muted);font-size:.85rem}
main{padding-top:14px}
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 10px;font-size:.9rem}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.grow{flex:1}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;background:var(--card);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;margin:8px 0 10px}
.meta select{width:auto;min-height:36px;padding:4px 8px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.group{font-family:var(--font-d);font-weight:600;font-size:1rem;margin:16px 0 6px;color:var(--muted)}
.item{display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line-strong);border-radius:var(--radius);overflow:hidden}
.item.soon{border-left-color:var(--warn)}
.item.expired{border-left-color:var(--bad)}
.item.empty{opacity:.55}
.item-main{flex:1;min-width:0;text-align:left;background:none;border:0;padding:8px 10px;display:flex;align-items:center;gap:10px}
.item-main .txt{display:grid;gap:1px;min-width:0;flex:1}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-size:1.65rem;line-height:1}
.ico.big{width:56px;height:56px}
.ico .pi{width:30px;height:30px;color:var(--accent);stroke-width:1.8}
.pi.s{width:20px;height:20px;stroke-width:2;display:inline-block;vertical-align:-4px}
.chip .pi.s{margin-right:4px}
.icon-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.icon-row .hint{flex-basis:100%;margin:0}
.picker{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--card)}
.picker .pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:260px;overflow:auto;margin-top:8px}
.pick{display:grid;justify-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:.72rem;color:var(--muted);min-width:0}
.pick .e{display:grid;place-items:center;height:34px}
.pick .pi{width:30px;height:30px;color:var(--accent)}
.pick span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
[hidden]{display:none!important}
.serv{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0 4px}
.serv .lbl{font-weight:600;flex:1;min-width:120px}
.serv .stepper{padding:0}
.serv .stepper .q{min-width:92px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.rate .lbl{font-weight:600;flex:1;min-width:130px}
.rate .stars{display:flex}
.rate .stars button{background:none;border:0;font-size:1.9rem;line-height:1;color:var(--warn);padding:2px;min-width:42px;min-height:46px}
.star-s{color:var(--warn);letter-spacing:1px;white-space:nowrap}
.tiles{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{width:100%;height:100%;display:flex;flex-direction:column;align-items:stretch;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;text-align:left;min-height:168px}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:4px;flex-wrap:wrap;min-height:24px}
.pill{font-size:.68rem;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--paper);color:var(--muted);white-space:nowrap;line-height:1.2}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.tq{font-weight:700;font-size:.8rem;color:var(--muted);white-space:nowrap;margin-left:auto}
.tile-ico{flex:1;display:grid;place-items:center;padding:4px 0}
.pi{display:block;stroke-width:1.6;flex:none}
.tile-ico .pi{width:clamp(46px,15vw,62px);height:clamp(46px,15vw,62px);color:var(--accent)}
.tile-name{font-weight:600;font-size:.86rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.4em;overflow-wrap:anywhere}
.tile.empty{opacity:.5}
.searchrow{display:flex;gap:8px;margin-bottom:12px}
.searchrow input{flex:1;min-width:0;border-radius:16px;min-height:50px;padding:0 16px}
.filterbtn{flex:none;position:relative;width:50px;min-height:50px;border-radius:16px;border:1px solid var(--line-strong);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.filterbtn svg{width:22px;height:22px}
.filterbtn.on::after{content:'';position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.wrapchips{flex-wrap:wrap;overflow:visible}
.fpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 12px 12px;margin:-4px 0 12px}
.fpanel .flabel{font-weight:600;font-size:.86rem;color:var(--muted);margin:8px 0 0}
.fpanel .chips{padding-top:6px}
.activef{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.qrow{display:flex;gap:6px;align-items:center}
.qrow input{text-align:center;min-width:0}
.qrow .btn{flex:none;width:44px;padding:0;font-size:1.2rem}
.addopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.addopt{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px 16px}
.addopt .addimg{width:100%;max-width:116px;aspect-ratio:1/1;display:block}
.addopt .addimg svg{width:100%;height:100%;display:block}
.addopt b{font-family:var(--font-d);font-size:1.05rem;margin-top:2px}
.addopt small{color:var(--muted);font-size:.78rem;line-height:1.25}
.dtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dtop h2{overflow-wrap:anywhere}
.x{flex:none;background:none;border:0;font-size:1.6rem;line-height:1;width:44px;height:44px;margin-right:-8px}
.dhead{display:flex;gap:14px;align-items:flex-start;margin-top:12px}
.dimg{flex:none;width:96px;height:96px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.dimg .pi{width:58px;height:58px;color:var(--accent)}
.dgrid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;min-width:0}
.dgrid .k{font-size:.76rem;color:var(--muted);font-weight:600}
.dgrid .v{font-weight:700;overflow-wrap:anywhere;line-height:1.25}
.dgrid .s{font-size:.76rem;font-weight:600;color:var(--muted)}
.dgrid .s.soon{color:var(--warn)} .dgrid .s.expired{color:var(--bad)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.dbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--card);font-weight:700;padding:0 8px}
.dbtn svg{width:20px;height:20px;flex:none}
.dbtn.good{color:var(--ok);border-color:var(--ok)}
.dbtn.bad{color:var(--bad);border-color:var(--bad)}
.dlabel{margin:20px 0 6px;font-weight:600;color:var(--muted)}
.dfoot{color:var(--muted);font-size:.84rem;text-align:center;margin:18px 0 0;overflow-wrap:anywhere}
.dlink{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:.95rem;padding:12px}
.toast-btn{background:none;border:0;color:var(--paper);text-decoration:underline;font-weight:700;margin-left:10px;padding:4px 2px;font-size:inherit}
.logline{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.logline span:last-child{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
.seg.two{grid-template-columns:1fr 1fr}
.shop{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 10px}
.shop .chk{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:var(--paper);color:#fff;font-weight:700;display:grid;place-items:center;padding:0}
.shop.done .chk{background:var(--ok);border-color:var(--ok)}
.shop .st{flex:1;min-width:0;display:grid}
.shop .stt{font-weight:600;overflow-wrap:anywhere}
.shop small{color:var(--muted);font-size:.76rem}
.shop.done .stt{text-decoration:line-through;color:var(--muted)}
.x.sm{width:38px;height:38px;font-size:1.1rem;margin:0;color:var(--muted)}
.chkrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:500;margin:0;font-size:1rem}
.chkrow input{width:22px;height:22px;flex:none}
.chkrow small{margin-left:auto;color:var(--muted)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.weeknav b{font-family:var(--font-d)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dhd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{display:flex;align-items:center;gap:6px;margin-top:8px}
.pl-main{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px}
.pl-main .thumb{flex:none;width:44px;height:44px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--font-d);font-weight:700;overflow:hidden}
.pl-main .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pl-main .tt{min-width:0;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.pl-text{flex:1;min-width:0;background:var(--paper);border:1px dashed var(--line-strong);border-radius:12px;padding:12px;font-weight:600;overflow-wrap:anywhere}
.pickrow{display:flex;justify-content:space-between;gap:8px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;font-weight:600}
.addopts.rows{grid-template-columns:1fr}
.addopts.rows .addopt{flex-direction:row;text-align:left;align-items:center;gap:12px;padding:10px 12px}
.addopts.rows .addimg{width:64px;max-width:64px;flex:none}
.addopts.rows .atx{display:grid;gap:2px}
.ingrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;list-style:none}
.ingrow.flag{border-color:var(--warn);background:var(--warn-soft)}
.ingrow .raw{font-size:.86rem;color:var(--muted);margin-bottom:6px;overflow-wrap:anywhere}
.ingrow .why{display:block;color:var(--warn);font-weight:600;font-size:.78rem}
.ingrow .ctl{display:grid;grid-template-columns:68px 92px minmax(0,1fr);gap:6px}
.ingrow .ctl input,.ingrow .ctl select{min-height:40px;padding:6px 8px;min-width:0}
.ingrow .optl{display:flex;gap:6px;align-items:center;font-size:.84rem;margin:6px 0 0;font-weight:500}
.ingrow .optl input{width:18px;height:18px}
.ingh{font-family:var(--font-d);font-weight:600;margin:10px 0 0;list-style:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:10px;padding:6px 2px;font-weight:600;font-size:.84rem;color:var(--muted);display:grid;justify-items:center;min-height:46px;align-content:center}
.seg button small{font-weight:500;font-size:.72rem;opacity:.85}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.item-main .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-main .sub{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp{font-size:.82rem;font-weight:600;color:var(--muted)}
.exp.soon{color:var(--warn)} .exp.expired{color:var(--bad)}
.stepper{display:flex;align-items:center;gap:2px;padding:0 6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--paper);font-size:1.25rem;line-height:1}
.stepper .q{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.empty-state{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:22px 16px;text-align:center;color:var(--muted)}
.empty-state h3{color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.empty-state .row{justify-content:center;margin-top:12px}
.rc{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:left;width:100%}
.rc .thumb{flex:none;width:72px;height:72px;border-radius:10px;background:var(--accent-soft);object-fit:cover;display:grid;place-items:center;color:var(--accent);font-family:var(--font-d);font-weight:700;font-size:1.4rem;overflow:hidden}
.rc .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rc .body{min-width:0;flex:1}
.rc .title{font-family:var(--font-d);font-weight:600;font-size:1.02rem;line-height:1.2;margin-bottom:6px}
.rc .line{font-size:.84rem;color:var(--muted);margin-top:5px}
.rc .line b{color:var(--ink)}
.rc .use{color:var(--warn);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--warn);display:inline-block}
.dot.have{background:var(--accent);border-color:var(--accent)}
.dot.staple{background:var(--line-strong);border-color:var(--line-strong)}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 9px;font-size:.72rem;color:var(--muted);display:grid;gap:2px;justify-items:center;font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--accent)}

<script id="logic">
/* ====== Pure logic (ingredient parsing + matching) ====== */
const CATS=['Groente & fruit','Zuivel & eieren','Vlees & vis','Brood & ontbijt','Pasta, rijst & granen','Conserven','Sauzen & kruiden','Snacks & zoet','Dranken','Diepvries','Overig'];
const UNIT_OPTS=['stuks','pak','blik','fles','pot','zak','tube','rol','g','kg','ml','l'];
const SECTIONS=[{id:'eten',label:'Eten'},{id:'verzorging',label:'Verzorging'},{id:'schoonmaak',label:'Schoonmaak'},{id:'overig',label:'Overig'}];
const CATS_BY={
  eten:CATS,
  verzorging:['Haar','Gezicht & huid','Lichaam','Tanden & mond','Scheren & ontharen','Make-up','Gezondheid','Overig'],
  schoonmaak:['Was & kleding','Afwas','Keuken','Badkamer & toilet','Vloer & ramen','Algemeen','Papier & zakken','Overig'],
  overig:['Huisdier','Batterijen & lampen','Klussen','Keuken & huishouden','Overig']
};
const DEFAULT_STAPLES=['zout','peper','water','olie','olijfolie','zonnebloemolie'];

const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

const UNITS=new Set(['g','gr','gram','kg','mg','ml','l','cl','dl','el','tl','eetlepel','eetlepels','theelepel','theelepels','tbsp','tbs','tb','tsp','ts','cup','cups','oz','lb','lbs','stuk','stuks','teen','tenen','blik','blikje','blikjes','pak','pakje','pakjes','pack','packet','bos','bosje','handvol','handful','snuf','snufje','scheut','scheutje','plak','plakje','plakken','plakjes','takje','takjes','tak','fles','flesje','pot','potje','zak','zakje','bol','pinch','clove','cloves','slice','slices','can','tin','bunch','sprig','sprigs','stick','sticks','blokje','blokjes','cube','cubes','stengel','stengels','blad','blaadjes','bladeren','heel','hele','half','halve','flinke','kleine','grote','small','large','medium','big','few','paar','beetje','little','touch','piece','pieces','stukje','stukjes','portie','porties']);
const STOP=new Set(['of','van','de','het','een','the','and','en','met','in','to','for','op','or','naar','smaak','taste','optional','optioneel','wens','plus','extra','fresh','freshly','verse','vers','gehakt','gehakte','chopped','diced','sliced','grated','geraspte','gesneden','fijn','finely','thinly','thin','dun','dunne','reepjes','ringen','rings','kleingesneden','roughly','minced','crushed','peeled','geschild','gepeld','serve','serveren','finish','garnish','garnering','erbij','top','on','om','te','needed','if','nodig','indien','add','heavy']);

const PHRASES=[
 [/olijf ?olie|olive oil|extra vergine olie/g,'olijf olie'],
 [/sesam ?olie|sesame oil/g,'sesam olie'],
 [/zonnebloem ?olie|sunflower oil|vegetable oil|plantaardige olie/g,'zonnebloem olie'],
 [/stock cubes?|bouillon ?blok\w*|bouillon ?tablet\w*|(?:beef|chicken|vegetable|kip|rund|groente)\s*(?:stock|bouillon)/g,'bouillon'],
 [/garlic (?:powder|granules)|knoflook ?poeder|knoflook ?granulaat/g,'knoflookpoeder'],
 [/onion powder|uien ?poeder/g,'uienpoeder'],
 [/bell peppers?/g,'paprika'],
 [/cherry tomat\w*|cherrytomat\w*|kerstomat\w*|grape tomat\w*|trostomat\w*|plum tomat\w*|pomodorini/g,'tomaat'],
 [/spring onions?|lente ?uien|bosui\w*/g,'bosui'],
 [/sour cream|zure room/g,'zuurroom'],
 [/creme fraiche/g,'cremefraiche'],
 [/parmezaan\w*|parmesan|parmigiano(?: reggiano)?|grana padano/g,'parmezaan'],
 [/tomato (?:puree|paste)|tomatenpuree/g,'tomatenpuree'],
 [/soy sauce|soya ?saus|sojasaus/g,'sojasaus'],
 [/chill?i ?(?:flakes|vlok\w*)/g,'chilivlokken'],
 [/chill?i(?!vlok)/g,'chili'],
 [/black pepper|zwarte peper|ground pepper|gemalen peper/g,'peper'],
 [/all[- ]purpose flour|plain flour|self[- ]raising flour|tarwebloem/g,'bloem']
];
const WORDS={chicken:'kip',kippenfilet:'kip',kipfilet:'kip',kippendij:'kip',kippendijen:'kip',garlic:'knoflook',onion:'ui',onions:'ui',uien:'ui',cream:'room',kookroom:'room',slagroom:'room',milk:'melk',butter:'boter',roomboter:'boter',cheese:'kaas',egg:'ei',eggs:'ei',eieren:'ei',tomato:'tomaat',tomatoes:'tomaat',tomaten:'tomaat',rice:'rijst',salmon:'zalm',tuna:'tonijn',sugar:'suiker',salt:'zout',pepper:'peper',spinach:'spinazie',zucchini:'courgette',potato:'aardappel',potatoes:'aardappel',aardappelen:'aardappel',cucumber:'komkommer',lemon:'citroen',carrot:'wortel',carrots:'wortel',wortelen:'wortel',mushroom:'champignon',mushrooms:'champignon',yogurt:'yoghurt',bread:'brood',basil:'basilicum',parsley:'peterselie',flour:'bloem',oil:'olie',beans:'bonen',bean:'bonen',wraps:'tortilla',wrap:'tortilla',shrimp:'garnaal',garnalen:'garnaal',prawns:'garnaal',red:'rode',white:'witte',green:'groene',noodles:'noedels',bacon:'spek',sausage:'worst',honey:'honing',vinegar:'azijn',wine:'wijn',lettuce:'sla',shallot:'sjalot',shallots:'sjalot',capers:'kappertjes',cabbage:'kool',celery:'selderij',ginger:'gember',cumin:'komijn',cinnamon:'kaneel',thyme:'tijm',rosemary:'rozemarijn',coriander:'koriander',cilantro:'koriander',chives:'bieslook',dill:'dille',mint:'munt',peas:'erwten',corn:'mais',cauliflower:'bloemkool',eggplant:'aubergine',almonds:'amandel',almond:'amandel',walnuts:'walnoot',peanuts:'pinda',peanut:'pinda',mayonnaise:'mayonaise',mustard:'mosterd',vanilla:'vanille',cocoa:'cacao',chocolate:'chocolade',oats:'havermout',mozerella:'mozzarella',mozarella:'mozzarella'};

function stem(w){
  w=w.replace(/aa/g,'a').replace(/ee/g,'e').replace(/oo/g,'o').replace(/uu/g,'u');
  if(w.length>4&&w.endsWith('en'))return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s'))return w.slice(0,-1);
  if(w.length>4&&w.endsWith('e'))return w.slice(0,-1);
  return w;
}
function tokenize(text){
  let s=norm(text).replace(/[\u2019'`]/g,'');
  for(const [re,to] of PHRASES)s=s.replace(re,' '+to+' ');
  const out=[];
  for(const w0 of s.split(/[^a-z0-9]+/)){
    if(!w0||w0.length<2||/\d/.test(w0))continue;
    if(STOP.has(w0)||UNITS.has(w0))continue;
    const t=stem(WORDS[w0]||w0);
    if(t.length>=2&&!out.includes(t))out.push(t);
  }
  return out;
}

const OPT_RE=/optioneel|optional|naar smaak|to taste|naar wens|to serve|to finish|to garnish|garnish|garnering|om te serveren|voor erbij/i;
const HEADER_WORDS=/^(salad|salade|sauce|saus|dressing|topping|garnish|marinade|filling|vulling|dough|deeg|ingredients|ingredienten|ingrediënten|serveren|to serve)$/i;
const hasNum=p=>/^\s*[\d¼½¾⅓⅔]/.test(p);

function splitLine(t){
  const parts=t.split(/\s*[,;]\s*/).filter(Boolean);
  if(parts.length<2)return [t];
  if(!hasNum(parts[0]))return parts;
  const out=[parts[0]];
  for(const p of parts.slice(1))if(hasNum(p))out.push(p);
  return out;
}
function splitAnd(p){return hasNum(p)?[p]:p.split(/\s+(?:&|and|en)\s+/i).filter(Boolean);}

function cleanLabel(t){
  const s=String(t).replace(/\([^)]*\)/g,'').replace(/\p{Extended_Pictographic}|\uFE0F/gu,'').trim();
  const w=s.split(/\s+/);
  while(w.length>1){
    const x=norm(w[0]);
    if(/^[\d¼½¾⅓⅔.,/\-–—]+[a-z]*$/.test(x)||UNITS.has(x)){w.shift();continue;}
    break;
  }
  return w.join(' ').replace(/^(of|van|de|het|een)\s+/i,'').trim()||String(t).trim();
}

function parseIngredients(text){
  const lines=[];
  for(const rawLine of String(text||'').split(/\r?\n/)){
    let t=rawLine.replace(/[\u200B-\u200D\u2060-\u2064\uFEFF]/g,'').trim();
    if(!t)continue;
    if(/^#/.test(t)){lines.push({raw:t.replace(/^#+\s*/,'').replace(/:\s*$/,''),header:true});continue;}
    t=t.replace(/^[\s*\-–—•▪▫◦·\uFE0F\p{Extended_Pictographic}]+/u,'').trim();
    if(!t)continue;
    if(/[:?]\s*$/.test(t)||HEADER_WORDS.test(t)||(!/\d/.test(t)&&(/^(for|voor)\b/i.test(t)||/ingredi[eë]nts?$/i.test(t)))){
      lines.push({raw:t.replace(/[:?]\s*$/,''),header:true});continue;
    }
    const display=t;
    if(/:\s*\S/.test(t))t=t.slice(t.indexOf(':')+1).trim();
    const t2=t.replace(/\([^)]*\)/g,' ');
    const pieces=splitLine(t2);
    if(!hasNum(t2)&&pieces.some(p=>p.trim().split(/\s+/).length>=6)){lines.push({raw:display,note:true});continue;}
    const optional=OPT_RE.test(display);
    const parts=pieces.flatMap(splitAnd).map(p=>({raw:p.trim(),text:cleanLabel(p),tokens:tokenize(p)}));
    lines.push({raw:display,optional,parts});
  }
  return lines;
}

function partMatch(tokens,entries){
  if(!tokens.length)return null;
  for(const e of entries){
    const pt=e.tokens;if(!pt.length)continue;
    if(pt.every(t=>tokens.includes(t)))return e;
    if(tokens.length<=pt.length&&tokens.every(t=>pt.includes(t)))return e;
  }
  return null;
}

function daysUntil(dateStr,today){
  if(!dateStr)return null;
  const [y,m,d]=dateStr.split('-').map(Number);
  const t=new Date(y,m-1,d).getTime();
  const n=today||new Date();
  const base=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  return Math.round((t-base)/864e5);
}

function analyzeRecipe(recipe,items,staples,overrides,today,linesOverride){
  const pantry=items.filter(i=>(+i.qty||0)>0).map(i=>({tokens:tokenize(i.name),item:i}));
  const stap=staples.map(s=>({tokens:tokenize(s),staple:true,name:s}));
  const lines=linesOverride||parseIngredients(recipe.ingredients);
  let total=0,have=0;const missing=[],expiring=[],out=[],used=[];
  for(const L of lines){
    if(L.header||L.note){out.push({...L,kind:L.header?'header':'note'});continue;}
    const key=recipe.id+'|'+norm(L.raw);
    let status='skip',usedItem=null;const miss=[];
    const parts=L.parts.map(p=>({...p,st:'skip'}));
    for(const p of parts){
      if(!p.tokens.length)continue;
      const m=partMatch(p.tokens,pantry);
      if(m){usedItem=usedItem||m.item;if(!used.some(u=>u.id===m.item.id))used.push(m.item);p.st='have';if(status!=='missing')status='have';continue;}
      const s=partMatch(p.tokens,stap);
      if(s){p.st='staple';if(status==='skip')status='staple';continue;}
      p.st='missing';status='missing';miss.push(p.text);
    }
    const auto=status;
    const ov=overrides&&overrides[key];
    if(ov==='have')status='have';else if(ov==='missing')status='missing';
    if(status==='missing'&&!miss.length)miss.push(cleanLabel(L.raw));
    const res={...L,parts,kind:'ing',key,status,auto,manual:!!ov,item:usedItem,miss};
    out.push(res);
    if(status==='skip'||L.optional)continue;
    total++;
    if(status==='missing')missing.push(...miss);else{have++;
      if(usedItem&&!ov){const d=daysUntil(usedItem.expiry,today);if(d!==null&&d<=3&&!expiring.some(e=>e.item.id===usedItem.id))expiring.push({item:usedItem,days:d});}
    }
  }
  let firstItem=null;
  for(const u of used){if(u.expiry&&(!firstItem||u.expiry<firstItem.expiry))firstItem=u;}
  return {lines:out,total,have,missing,expiring,used,firstItem,minExpiry:firstItem?firstItem.expiry:'',can:total>0&&missing.length===0};
}

/* ====== Servings: parse yield and scale quantities in an ingredient line ====== */
function parseYield(y){const m=String(y||'').match(/\d+/);const n=m?parseInt(m[0],10):0;return n>0?n:null;}
const FRAC={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function parseQty(s){
  s=s.trim();
  let m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/);if(m)return +m[1]+m[2]/m[3];
  m=s.match(/^(\d+)\/(\d+)$/);if(m)return m[1]/m[2];
  m=s.match(/^(\d+)([¼½¾⅓⅔⅛⅜⅝⅞])$/);if(m)return +m[1]+FRAC[m[2]];
  if(FRAC[s]!==undefined)return FRAC[s];
  return parseFloat(s.replace(',','.'));
}
function fmtNum(v){
  if(!(v>0))return '0';
  if(v>=20)return String(Math.round(v));
  const whole=Math.floor(v+1e-9),rest=v-whole;
  if(rest<0.04)return String(whole);
  if(rest>0.96)return String(whole+1);
  for(const [x,s] of [[.125,'⅛'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.5,'½'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.875,'⅞']])if(Math.abs(rest-x)<0.04)return (whole?String(whole):'')+s;
  if(v>=10)return String(Math.round(v));
  return String(Math.round(v*10)/10).replace('.',',');
}
const QN='\\d+\\s+\\d+\\/\\d+|\\d+\\/\\d+|\\d+[.,]\\d+|\\d+[¼½¾⅓⅔⅛⅜⅝⅞]|\\d+|[¼½¾⅓⅔⅛⅜⅝⅞]';
const QRE=new RegExp('(^|[^\\p{L}\\d.,/])('+QN+')(?:(\\s*[-–]\\s*)('+QN+'))?(?=$|[^\\d/%°]|[.,](?!\\d))','gu');
function scaleLine(raw,f){
  if(!f||Math.abs(f-1)<1e-9)return raw;
  return String(raw).replace(QRE,(all,pre,a,sep,b,off,str)=>{
    const after=str.slice(off+all.length);
    if(/^\s*(min|minuten|minutes|uur|hour|hours|graden|cm|mm)\b/i.test(after))return all;
    const letters=(after.match(/^\p{L}+/u)||[''])[0];
    if(letters&&!/^(g|gr|kg|mg|ml|l|cl|dl|el|tl|tb|tbs|tbsp|tsp|ts|oz|lb|lbs|cups?|x|p)$/i.test(letters))return all;
    const va=parseQty(a);if(!(va>0))return all;
    let out=pre+fmtNum(va*f);
    if(b){const vb=parseQty(b);if(vb>0)out+=sep+fmtNum(vb*f);else out=all;}
    return out;
  });
}

function mimeOf(b){
  if(b.startsWith('/9j/'))return 'image/jpeg';
  if(b.startsWith('iVBOR'))return 'image/png';
  if(b.startsWith('R0lGOD'))return 'image/gif';
  if(b.startsWith('UklGR'))return 'image/webp';
  if(b.startsWith('AAAA'))return 'image/heic';
  return 'image/jpeg';
}
function guessCategory(tags){
  const t=(tags||[]).join(' ').toLowerCase();
  const rules=[['Diepvries',/frozen/],['Conserven',/canned|preserved/],['Zuivel & eieren',/dairies|milk|cheese|yogurt|yoghurt|eggs|butter|cream/],['Vlees & vis',/meat|fish|seafood|poultry|chicken|sausage|ham\b/],['Dranken',/beverage|drink|juice|waters|coffee|teas/],['Snacks & zoet',/snack|biscuit|chocolate|sweet|candy|cake|confectionery/],['Sauzen & kruiden',/sauce|condiment|spice|herb|oils|vinegar|seasoning|stock|bouillon/],['Pasta, rijst & granen',/pasta|rice|noodle|flour|grain|cereal/],['Brood & ontbijt',/bread|breakfast|spreads|jam|honey/],['Groente & fruit',/vegetable|fruit|legume|potato/]];
  for(const [c,re] of rules)if(re.test(t))return c;
  return 'Overig';
}
/* ====== Sections: eten / verzorging / schoonmaak / overig ====== */
const RX_VERZ=/shampoo|conditioner|tandpasta|tandenborstel|mondwater|douche|deodorant|zonnebrand|bodylotion|handcreme|gezichtscreme|dagcreme|nachtcreme|zonnecreme|lotion|gezichtsreiniger|micellair|scheerschuim|scheermesje|scheergel|ontharing|wattenstaaf|wattenschijf|maandverband|tampon|inlegkruis|pleister|vitamine|supplement|paracetamol|ibuprofen|neusspray|haarlak|haargel|haarverf|parfum|nagellak|mascara|lippen|make-?up|foundation|flosdraad|handzeep|badschuim/;
const RX_SCHOON=/wasmiddel|waspoeder|wascapsule|wasverzachter|wasparfum|afwas|vaatwas|glansspoel|schoonmaak|allesreiniger|reiniger|toiletpapier|\bwc\b|toiletblok|keukenrol|keukenpapier|vuilniszak|afvalzak|bleekmiddel|\bbleek\b|ontkalk|\bspons(en)?\b|dweil|schuurmiddel|stofzuigerzak/;
const RX_OVERIG=/batterij|\blamp|gloeilamp|kaars|lucifer|aansteker|hondenvoer|kattenvoer|hondenbrokken|kattenbrokken|kattenbak|aluminiumfolie|vershoudfolie|bakpapier|vriezerzak|\btape\b|\blijm\b|schroef|kabel/;
function guessSection(name){
  const n=norm(name);
  if(RX_VERZ.test(n))return 'verzorging';
  if(RX_SCHOON.test(n))return 'schoonmaak';
  if(RX_OVERIG.test(n))return 'overig';
  if(/zeep/.test(n))return 'verzorging';
  return 'eten';
}
const CAT_RULES={
  verzorging:[['Haar',/shampoo|conditioner|haar/],['Tanden & mond',/tand|mondwater|flos/],['Scheren & ontharen',/scheer|ontharing/],['Make-up',/mascara|lippen|nagel|foundation|make-?up/],['Gezondheid',/vitamine|supplement|paracetamol|ibuprofen|pleister|neusspray|tampon|maandverband|inlegkruis|wattenstaaf|wattenschijf/],['Gezicht & huid',/gezicht|micellair|zonnebrand|zonnecreme|dagcreme|nachtcreme/],['Lichaam',/douche|deodorant|zeep|bodylotion|handcreme|lotion|bad/]],
  schoonmaak:[['Afwas',/afwas|vaatwas|glansspoel/],['Was & kleding',/wasmiddel|waspoeder|wascapsule|wasverzachter|wasparfum/],['Papier & zakken',/papier|keukenrol|vuilnis|afvalzak|zak/],['Badkamer & toilet',/toilet|\bwc\b|ontkalk|bleek|badkamer/],['Vloer & ramen',/vloer|dweil|raam|glas|stofzuiger/],['Keuken',/keuken|spons|vet/],['Algemeen',/allesreiniger|reiniger|schoonmaak|schuur/]],
  overig:[['Huisdier',/honden|katten|dier/],['Batterijen & lampen',/batterij|lamp/],['Klussen',/tape|lijm|schroef|kabel/],['Keuken & huishouden',/folie|bakpapier|vershoud|vriezer|kaars|lucifer|aansteker/]]
};

function parseKw(k){return k.split(',').map(s=>s.trim()).filter(Boolean).map(s=>({exact:s[0]==='=',sp:s[0]==='!',kw:norm(s.replace(/^[=!]/,''))}));}
const ICON_INDEX=PRODUCT_ICONS.map(([e,label,kws])=>({e,label,kws:parseKw(kws)}));
function near(a,b){
  if(a===b)return true;const la=a.length,lb=b.length;if(Math.abs(la-lb)>1)return false;
  let i=0,j=0,e=0;
  while(i<la&&j<lb){if(a[i]===b[j]){i++;j++;continue;}if(++e>1)return false;if(la>lb)i++;else if(lb>la)j++;else{i++;j++;}}
  return e+(la-i)+(lb-j)<=1;
}
const ICON_CACHE=new Map();
function iconFor(item){
  if(item&&item.icon)return item.icon;
  const key=(item&&item.name||'')+'|'+(item&&item.category||'');
  if(ICON_CACHE.has(key))return ICON_CACHE.get(key);
  const nameN=norm(item&&item.name||'').replace(/[\u2019'`]/g,'').trim();
  const raw=nameN.split(/[^a-z0-9]+/).filter(Boolean),toks=raw.map(stem);
  let best=null,bs=0;
  for(const ic of ICON_INDEX)for(const k of ic.kws){
    let s=0;
    if(k.exact){if(nameN===k.kw)s=100;}
    else{
      const idx=nameN.indexOf(k.kw),tokEq=toks.includes(stem(k.kw));
      if(idx>=0&&(k.kw.length>=4||tokEq))s=k.kw.length+idx*0.6+(k.sp?30:0)+(tokEq?8:0);
      else if(k.kw.length>=5&&raw.some(t=>t.length>=5&&near(t,k.kw)))s=k.kw.length*0.6+(k.sp?10:0);
    }
    if(s>bs){bs=s;best=ic.e;}
  }
  const r=best||CAT_ICON[item&&item.category]||'🥫';
  ICON_CACHE.set(key,r);return r;
}

function addDaysISO(s,n){const d=parseISO(s);d.setDate(d.getDate()+n);return isoOf(d);}
function mondayOf(s){const d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return isoOf(d);}

/* ====== Importing: text (e.g. an Instagram caption) -> recipe ====== */
const RX_H_ING=/^[^\p{L}\d]*(ingredi[eë]nten|ingredients|wat (?:heb|moet) je nodig|benodigdheden|je hebt nodig|you(?:'ll| will)? need|what you need|nodig)\b/iu;
const RX_H_INS=/^[^\p{L}\d]*(bereiding(?:swijze)?|instructies|instructions|method|directions|werkwijze|zo maak je het|steps|stappen|how to make(?: it)?|aan de slag)\b/iu;
const RX_ING_LIKE=/^[\s•▪▫◦·*\-–—\uFE0F\p{Extended_Pictographic}]*(\d|[¼½¾⅓⅔⅛]|een\b|half\b|halve\b|snufje|handvol|scheut|beetje|pinch|dash)/iu;
const stripLead=l=>l.replace(/^[\s•▪▫◦·*\-–—\uFE0F\p{Extended_Pictographic}]+/u,'').trim();
function parseRecipeText(raw,opts){
  opts=opts||{};
  let lines=String(raw||'').replace(/\r/g,'').split('\n').map(s=>s.replace(/[\u200B-\u200D\u2060-\u2064\uFEFF]/g,'').trim());
  lines=lines.filter(l=>!/^(#[\p{L}\d_]+\s*)+$/u.test(l)&&!/link in (bio|profiel)|volg (mij|ons)|follow (me|us)|save (this|for later)|bewaar (dit|deze)/i.test(l));
  const head=(rx,from)=>lines.findIndex((l,i)=>i>=(from||0)&&l&&l.length<=45&&rx.test(l));
  const iI=head(RX_H_ING);
  let title=opts.title||'',ingredients=[],instr=[],intro=[];
  if(iI>=0){
    const iS=head(RX_H_INS,iI+1);
    let block=lines.slice(iI+1,iS>=0?iS:lines.length),after=[];
    if(iS>=0)after=lines.slice(iS+1);
    else{const k=block.findIndex((l,i)=>l===''&&block.slice(0,i).some(Boolean));if(k>=0){after=block.slice(k+1);block=block.slice(0,k);}}
    ingredients=block.filter(Boolean);instr=after.filter(Boolean);intro=lines.slice(0,iI).filter(Boolean);
  }else{
    const all=lines.filter(Boolean);
    const isIng=l=>RX_ING_LIKE.test(l)&&!/^\s*\d+[.)]\s/.test(l)&&l.split(/\s+/).length<=10;
    ingredients=all.filter(isIng);instr=all.filter(l=>!isIng(l));
    if(!title&&instr.length&&instr[0].length<=80&&ingredients.length){title=instr[0];instr=instr.slice(1);}
  }
  if(!title){const f=intro.find(l=>l.length<=80);if(f){title=f;intro=intro.filter(l=>l!==f);}}
  title=stripLead(title).replace(/[\s\uFE0F\p{Extended_Pictographic}]+$/u,'').replace(/[:.!\s]+$/,'');
  const ing=ingredients.map(l=>/:\s*$/.test(l)?'# '+stripLead(l).replace(/:\s*$/,''):stripLead(l)).filter(Boolean);
  const ins=instr.map(l=>l.replace(/^\s*(?:\d+[.)]|[•▪▫◦·*\-–—])\s*/,'').trim()).filter(Boolean);
  return {title,ingredients:ing.join('\n'),instructions:ins.join('\n'),notes:intro.join('\n'),yield:'',categories:[],link:opts.link||'',images:[]};
}

function decodeEntities(s){

}
function stripTags(s){

function isoDuration(s){

}

}
function extractInstagramDraft(html,url){

/* ====== Ingredient model: quantity, unit and normalised product per ingredient ====== */
const PREP_WORDS=new Set(['dried','frozen','cooked','uncooked','large','small','medium','ripe','boneless','skinless','shredded','melted','softened','whole','gedroogde','gekookte','gesmolten','ontdooide','losse','grof','grove','kleine','grote','rijpe','zachte','hele','fijngehakte','gesneden','gepelde','afgespoeld','afgegoten','warm','warme','koud','koude','lauw','lauwe']);
const LEMMA={courgettes:'courgette',avocados:'avocado',paprikas:'paprika',champignons:'champignon',wortels:'wortel',tortillas:'tortilla',tomaatjes:'tomaat',citroenen:'citroen',appels:'appel',peren:'peer',bananen:'banaan',uitjes:'ui',sjalotten:'sjalot',olijven:'olijf',eetlepels:'el'};
function normalizeProduct(name){
  let s=norm(name).replace(/[\u2019'`]/g,'');
  for(const [re,to] of PHRASES)s=s.replace(re,' '+to+' ');
  const out=[];
  for(const w0 of s.split(/[^a-z0-9]+/)){
    if(!w0||w0.length<2||/\d/.test(w0))continue;
    if(STOP.has(w0)||UNITS.has(w0)||PREP_WORDS.has(w0))continue;
    const w=LEMMA[w0]||WORDS[w0]||w0;
    if(!out.includes(w))out.push(w);
  }
  return out.join(' ').replace(/\bolijf olie\b/,'olijfolie').replace(/\bsesam olie\b/,'sesamolie').replace(/\bzonnebloem olie\b/,'zonnebloemolie').replace(/\bzuurroom\b/,'zure room').replace(/\bcremefraiche\b/,'crème fraîche').replace(/\bparmezaan kaas\b/,'parmezaanse kaas');
}
const IMPERIAL={cup:['ml',240],oz:['g',28.35],lb:['g',453.6]};
const QRX=new RegExp('^\\s*('+QN+')(?:\\s*[-–]\\s*('+QN+'))?\\s*(\\p{L}+\\.?)?\\s*(.*)$','u');
function structureIngredient(raw,extraNote){
  const t=String(raw||'').replace(/[\u200B-\u200D\u2060-\u2064\uFEFF]/g,'').replace(/^[\s*\-–—•▪▫◦·\uFE0F\p{Extended_Pictographic}]+/u,'').trim();
  let qty=null,qty2=null,unit='',rest=t;
  const m=t.match(QRX);
  if(m){
    qty=parseQty(m[1]);qty2=m[2]?parseQty(m[2]):null;
    const u=m[3]?norm(m[3]).replace(/\.$/,''):'';
    if(u&&SHOP_UNIT_MAP[u]){unit=SHOP_UNIT_MAP[u];rest=m[4];}
    else rest=((m[3]||'')+' '+m[4]).trim();
    if(!(qty>0)){qty=null;qty2=null;}
  }
  if(qty!=null&&IMPERIAL[unit]){
    const mm=rest.match(/(\d+(?:[.,]\d+)?)\s*(kg|gr|gram|g|ml|cl|dl|l)\b/i);
    if(mm){qty=parseFloat(mm[1].replace(',','.'));unit=SHOP_UNIT_MAP[norm(mm[2])]||'';qty2=null;rest=rest.replace(mm[0],' ');}
    else{const [nu,f]=IMPERIAL[unit];qty=Math.round(qty*f);if(qty2!=null)qty2=Math.round(qty2*f);unit=nu;}
  }
  const note=[...rest.matchAll(/\(([^)]*)\)/g)].map(x=>x[1].trim()).filter(Boolean);
  rest=rest.replace(/\([^)]*\)/g,' ');
  const ci=rest.search(/[,;]/);
  if(ci>=0){const n=rest.slice(ci+1).trim();if(n)note.push(n);rest=rest.slice(0,ci);}
  rest=rest.replace(/\p{Extended_Pictographic}|\uFE0F/gu,'').replace(/^[-–—\s]+/,'').replace(/\s+/g,' ').trim();
  rest=cleanLabel(rest);
  if(extraNote)note.push(extraNote);
  const name=rest||t;
  return {qty,qty2,unit,name,product:normalizeProduct(name),note:note.filter(Boolean).join('; ')};
}
function hashStr(s){let x=5381;s=String(s||'');for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return (x>>>0).toString(36)+':'+s.length;}
function structureRecipe(text,oldRows){
  const rows=[];
  parseIngredients(text).forEach((L,li)=>{
    if(L.header){rows.push({kind:'header',raw:L.raw,line:li,lineRaw:L.raw});return;}
    if(L.note){rows.push({kind:'note',raw:L.raw,line:li,lineRaw:L.raw});return;}
    const paren=L.parts.length===1?((L.raw.match(/\(([^)]*)\)/)||[])[1]||''):'';
    for(const p of L.parts)rows.push({kind:'ing',raw:p.raw,line:li,lineRaw:L.raw,optional:!!L.optional,...structureIngredient(p.raw,paren),ok:false});
  });
  if(oldRows){
    const by=new Map();oldRows.forEach(o=>{if(o.kind==='ing'&&o.ok)by.set(o.raw,o);});
    rows.forEach(n=>{if(n.kind!=='ing')return;const o=by.get(n.raw);if(o)Object.assign(n,{qty:o.qty,qty2:o.qty2,unit:o.unit,name:o.name,product:o.product,note:o.note,optional:o.optional,ok:true});});
  }
  return rows;
}
/* rows -> the same "lines" shape that analyzeRecipe works with */
function rowsToLines(rows){
  const out=[],byLine=new Map();
  for(const r of rows){
    if(r.kind==='header'){out.push({raw:r.raw,header:true});continue;}
    if(r.kind==='note'){out.push({raw:r.raw,note:true});continue;}
    let L=byLine.get(r.line);
    if(!L){L={raw:r.lineRaw,optional:!!r.optional,parts:[]};byLine.set(r.line,L);out.push(L);}
    const label=r.product||r.name||r.raw;
    L.parts.push({raw:r.raw,text:label,tokens:r.product?tokenize(r.product):[],qty:r.qty,qty2:r.qty2,unit:r.unit,product:r.product,optional:!!r.optional});
  }
  return out;
}
const KNOWN_WORDS=new Set([...Object.values(WORDS),...DEFAULT_STAPLES,'pasta','spaghetti','penne','fusilli','rijst','brood','pesto','hummus','tofu','mais','erwt','bonen','linzen','mie','noedels','witte','rode','groene','eigeel','eiwit','kookzuivel','pijnboompitten','sesamzaad','sesamzaadjes','guanciale','pepperoni','kappertjes','bocconcini','mozzarella','sjalot','sla','gember','komijn','kaneel','tijm','kool','selderij','mayonaise','mosterd']);
function rowFlags(r){
  if(!r||r.kind!=='ing'||r.ok)return [];
  const f=[];
  if(!r.product)f.push('geen product herkend');
  else{
    const known=iconFor({name:r.product,category:'__none__'})!=='·'||r.product.split(' ').some(w=>KNOWN_WORDS.has(w));
    if(!known)f.push('onbekend product');
  }
  if(r.qty==null&&/^\s*[\d¼½¾⅓⅔]/.test(r.raw))f.push('hoeveelheid niet gelezen');
  return f;
}
function parseQtyInput(s){
  s=String(s==null?'':s).trim();
  if(!s)return {ok:true,val:null};
  const v=parseQty(s);
  return (v>0&&isFinite(v))?{ok:true,val:v}:{ok:false,val:null};
}

/* --- storage (IndexedDB) --- */
const DB={db:null,ok:false,warned:false,
  open(){return new Promise(res=>{try{
    const r=indexedDB.open('voorraadkast',1);
    r.onupgradeneeded=()=>{const d=r.result;['items','recipes','thumbs'].forEach(s=>d.createObjectStore(s,{keyPath:'id'}));d.createObjectStore('meta',{keyPath:'key'});};

  }catch(e){res(false)}});},
  /* Safari closes the connection when the app was in the background: reopen and retry */
  async tx(store,mode,fn){
    if(!this.ok)return [];
    let last=null;
    for(let attempt=0;attempt<3;attempt++){
      try{
        if(!this.db&&!(await this.open()))throw new Error('Opslag niet beschikbaar');
        return await new Promise((res,rej)=>{
          const t=this.db.transaction(store,mode),s=t.objectStore(store),r=fn(s);
          t.oncomplete=()=>res(r&&r.result!==undefined?r.result:undefined);
          t.onerror=()=>rej(t.error||new Error('Opslagfout'));
          t.onabort=()=>rej(t.error||new Error('Opslag afgebroken'));
        });
      }catch(e){last=e;this.db=null;}
    }
    this.fail(last);return undefined;
  },
  fail(e){
    console.warn('IndexedDB',e);
    if(!this.warned){this.warned=true;try{toast('Opslaan in de browser lukt nu niet. Je wijzigingen staan nog in de app. Maak een back-up bij Meer en open de app opnieuw.');}catch(x){}}
  },
  all(s){return this.tx(s,'readonly',st=>st.getAll()).then(r=>r||[])},
  put(s,v){return this.tx(s,'readwrite',st=>st.put(v))},
  putMany(s,arr){return this.tx(s,'readwrite',st=>{arr.forEach(v=>st.put(v))})},

let AN={key:'',map:{}};
/* --- ingredient model: stored per recipe in the meta store, separate from the Mela data --- */
function ensureModel(r){
  const hh=hashStr(r.ingredients||'');
  let m=S.ing[r.id];
  if(m&&m.h===hh)return m;
  m={h:hh,rows:structureRecipe(r.ingredients||'',m&&m.rows)};
  S.ing[r.id]=m;S.ingV++;
  DB.put('meta',{key:'ing:'+r.id,h:hh,rows:m.rows});
  return m;
}
const ingLines=r=>rowsToLines(ensureModel(r).rows);
const saveModel=r=>DB.put('meta',{key:'ing:'+r.id,h:S.ing[r.id].h,rows:S.ing[r.id].rows});
const flaggedCount=r=>ensureModel(r).rows.filter(x=>rowFlags(x).length).length;
function modelStats(){
  let rows=0,flagged=0;
  for(const r of S.recipes){const ing=ensureModel(r).rows.filter(x=>x.kind==='ing');rows+=ing.length;flagged+=ing.filter(x=>rowFlags(x).length).length;}
  return {rows,flagged};
}
function analysisMap(){
  const key=S.items.map(i=>i.id+i.name+i.qty+i.expiry+secOf(i)).join('|')+'#'+S.staples.join(',')+'#'+JSON.stringify(S.overrides)+'#'+S.recipes.length+'#'+S.ingV+todayStr();
  if(AN.key!==key){AN={key,map:{}};}
  return AN.map;
}
function analysis(r){ensureModel(r);const m=analysisMap();return m[r.id]||(m[r.id]=analyzeRecipe(r,eatItems(),S.staples,S.overrides,undefined,ingLines(r)));}

const ratingOf=r=>S.ratings[r.id]||0;

function thumbHtml(r){const t=S.thumbs[r.id];return `<span class="thumb">${t?`<img src="${t}" alt="" loading="lazy">`:esc((r.title||'?').trim().charAt(0).toUpperCase())}</span>`;}

function viewKokenCan(){
  $('#pageSub').textContent=S.recipes.length?`${S.recipes.length} recepten vergeleken met je voorraad`:'';
  if(!S.recipes.length)return `<div class="empty-state"><h3>Nog geen recepten</h3><p>Importeer je Mela-export via Meer, of maak een recept op het tabblad Recepten.</p><div class="row"><button class="btn primary" data-a="tab" data-v="meer">Naar Meer</button></div></div>`;
  if(!eatItems().length)return `<div class="empty-state"><h3>Je voorraad is leeg</h3><p>Voeg eerst eten toe, dan zie je hier welke recepten kunnen.</p><div class="row"><button class="btn primary" data-a="tab" data-v="voorraad">Naar voorraad</button></div></div>`;
  const all=S.recipes.map(r=>({r,a:analysis(r)})).filter(x=>x.a.total>0);
  const can=all.filter(x=>x.a.can).length,near=all.filter(x=>x.a.missing.length<=2).length,some=all.filter(x=>x.a.used.length>0).length;
  const list=all.filter(x=>S.cook==='can'?x.a.can:S.cook==='near'?x.a.missing.length<=2:S.cook==='some'?x.a.used.length>0:true);
  const byExp=S.cook==='some',exp=x=>x.a.minExpiry||'9999';
  list.sort((x,y)=>(byExp?(exp(x)<exp(y)?-1:exp(x)>exp(y)?1:0):0)||x.a.missing.length-y.a.missing.length||y.a.expiring.length-x.a.expiring.length||ratingOf(y.r)-ratingOf(x.r)||x.r.title.localeCompare(y.r.title,'nl'));
  const chip=(v,l)=>`<button class="chip" data-a="cook" data-v="${v}" aria-pressed="${S.cook===v}">${l}</button>`;
  const cards=list.map(({r,a})=>{
    const dots=a.lines.filter(l=>l.kind==='ing'&&l.status!=='skip'&&!l.optional).slice(0,30).map(l=>`<i class="dot ${l.status==='have'?'have':l.status==='staple'?'staple':''}"></i>`).join('');

  }).join('');
  return `<div class="chips" role="group" aria-label="Filter">${chip('can',`Alles in huis (${can})`)}${chip('near',`Mist maximaal 2 (${near})`)}${chip('some',`Min. 1 in huis (${some})`)}${chip('all','Alle recepten')}</div>

async function saveItem(it){
  const i=S.items.findIndex(x=>x.id===it.id);
  if(i>=0)S.items[i]=it;else S.items.push(it);
  await DB.put('items',it);
}
async function changeQty(id,dir){
  const it=S.items.find(i=>i.id===id);if(!it)return;
  const n=Math.round(((+it.qty||0)+dir*stepFor(it.unit))*100)/100;
  if(n<=0){
    if(confirm(`${it.name} is op. Uit de voorraad verwijderen?`)){S.items=S.items.filter(i=>i.id!==id);await DB.del('items',id);}
    else{it.qty=0;await DB.put('items',it);}
  }else{it.qty=n;await DB.put('items',it);}
  render();
}

const UNIT_PL={takje:'takjes',teen:'tenen',plak:'plakken',blik:'blikken',pak:'pakken',zak:'zakken',fles:'flessen',pot:'potten',bos:'bossen'};
const shopText=i=>(i.qty!=null?fmtNum(i.qty)+(i.unit?' '+((i.qty>1&&UNIT_PL[i.unit])||i.unit):'')+' ':'')+i.name;
function addToShop(entries,title){
  let n=0;
  for(const e of entries){
    const pl=parseShopLine(e.text);if(!pl.name)continue;
    const ex=S.shop.find(x=>!x.done&&x.key===pl.key&&(x.unit||'')===(pl.unit||''));
    if(ex){
      if(ex.qty!=null&&pl.qty!=null){ex.qty+=pl.qty;ex.text=shopText(ex);}
      if(title&&!(ex.from||[]).includes(title))(ex.from=ex.from||[]).push(title);
      n++;continue;
    }
    const it={id:uid(),qty:pl.qty,unit:pl.unit,name:pl.name,key:pl.key,cat:shopCategory(pl.name),done:false,from:title?[title]:[]};
    it.text=shopText(it);S.shop.push(it);n++;
  }
  return n;
}

let shopParts=[];
function recipeShopParts(r){
  const a=analysis(r),sv=servingsFor(r),f=sv.n/sv.base,out=[];
  for(const l of a.lines){if(l.kind!=='ing')continue;
    for(const p of l.parts){
      if(!p.tokens.length)continue;
      const q=p.qty!=null?Math.max(p.qty,p.qty2||0)*f:null;
      out.push({text:(q!=null?fmtNum(q)+(p.unit?' '+p.unit:'')+' ':'')+(p.product||p.text),st:p.st,optional:!!l.optional});
    }}
  return out;
}

  $('#pageSub').textContent=label;
  const valid=e=>!!e.text||S.recipes.some(r=>r.id===e.recipeId);
  const inWeek=S.plan.filter(e=>e.date>=ws&&e.date<=we&&valid(e)&&!e.text),ownN=S.plan.filter(e=>e.date>=ws&&e.date<=we&&e.text).length;

  <div class="grid2"><div><label for="tx-title">Titel (optioneel)</label><input id="tx-title" type="text"></div><div><label for="tx-link">Link of bron (optioneel)</label><input id="tx-link" type="text" inputmode="url" autocapitalize="off"></div></div>

async function fetchWithTimeout(u,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{return await fetch(u,{signal:c.signal});}finally{clearTimeout(t);}}
const PROXIES=[u=>u,u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
async function fetchHtml(url){
  for(const px of PROXIES){
    try{const r=await fetchWithTimeout(px(url),12000);if(!r.ok)continue;const t=await r.text();if(t&&t.length>300&&/<[a-z!][\s\S]*>/i.test(t))return {html:t};}catch(e){}
  }
  return null;
}
function blobToJpegB64(blob){return new Promise(res=>{const u=URL.createObjectURL(blob),img=new Image();
  img.onload=()=>{try{const s=Math.min(1,1000/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82).split(',')[1]);}catch(e){res(null);}URL.revokeObjectURL(u);};
  img.onerror=()=>{URL.revokeObjectURL(u);res(null);};img.src=u;});}
async function fetchImageB64(url){
  for(const px of PROXIES){
    try{const r=await fetchWithTimeout(px(url),12000);if(!r.ok)continue;const b=await r.blob();if(b.size<500)continue;const x=await blobToJpegB64(b);if(x)return x;}catch(e){}
  }
  return null;
}
async function importFromUrl(raw,progress){
  let url=String(raw||'').trim();
  if(!/^https?:\/\//i.test(url))url='https://'+url;
  let host;try{host=new URL(url).hostname;}catch(e){return {error:'Dit is geen geldige link.'};}
  const res=await fetchHtml(url);
  if(!res)return {error:'De pagina kon niet worden opgehaald. De site blokkeert dit misschien, of je hebt geen internet. Probeer “Plak tekst”.'};
  const ig=/(^|\.)instagram\.com$/i.test(host);
  let draft=extractRecipeFromHtml(res.html,url);
  if(!draft&&ig)draft=extractInstagramDraft(res.html,url);
  if(!draft)return {error:ig?'Instagram geeft het bijschrift niet vrij. Kopieer het bijschrift in de Instagram-app en plak het via “Plak tekst”.':'Op deze pagina staat geen recept dat de app kan lezen. Kopieer de tekst en plak die via “Plak tekst”.'};
  if(draft.imageUrl){if(progress)progress('Foto ophalen…');const b=await fetchImageB64(draft.imageUrl);if(b)draft.images=[b];}
  return {draft};
}
async function runLinkImport(){
  const msg=$('#lk-msg'),go=$('#lk-go');
  go.disabled=true;msg.textContent='Pagina ophalen…';
  const res=await importFromUrl($('#lk-url').value,s=>{msg.textContent=s;});
  if(!res.draft){msg.textContent=res.error;go.disabled=false;$('#lk-text').hidden=false;return;}
  closeSheet();recipeForm(null,res.draft);
  toast(res.draft.ingredients?'Controleer het recept en tik op Opslaan':'Geen ingrediënten gevonden. Vul ze zelf aan.');
}
function runTextImport(){
  const draft=parseRecipeText($('#tx-body').value,{title:$('#tx-title').value.trim(),link:$('#tx-link').value.trim()});
  if(!draft.ingredients&&!draft.instructions){toast('Er is niets herkend in deze tekst');return;}
  closeSheet();recipeForm(null,draft);
  toast(draft.ingredients?'Controleer het recept en tik op Opslaan':'Geen ingrediënten herkend. Vul ze zelf aan.');
}

const UNIT_CHOICES=[['','stuks'],['g','g'],['kg','kg'],['ml','ml'],['l','l'],['cl','cl'],['dl','dl'],['el','el'],['tl','tl'],['teen','teen'],['blik','blik'],['pak','pak'],['pot','pot'],['fles','fles'],['zak','zak'],['bos','bos'],['plak','plak'],['stuk','stuk'],['takje','takje'],['snuf','snuf'],['handvol','handvol'],['scheut','scheut']];
let reviewState=null;
function productSuggestions(){
  const c={};
  for(const m of Object.values(S.ing))for(const r of ((m&&m.rows)||[]))if(r.kind==='ing'&&r.product)c[r.product]=(c[r.product]||0)+1;
  S.items.forEach(i=>{const k=String(i.name||'').toLowerCase().trim();if(k)c[k]=(c[k]||0)+1;});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'nl')).slice(0,250).map(x=>x[0]);
}
function reviewSheet(id,opts){
  const r=S.recipes.find(x=>x.id===id);if(!r)return;
  const m=ensureModel(r);
  reviewState={id,rows:m.rows.map(x=>({...x})),only:!!(opts&&opts.only),after:!!(opts&&opts.afterSave)};
  renderReview();
}
function syncReview(){
  const f=$('#ingForm');if(!f||!reviewState)return;
  reviewState.rows.forEach((row,i)=>{
    if(row.kind!=='ing'||!f.elements['p'+i])return;
    const q=parseQtyInput(f.elements['q'+i].value);
    if(q.ok){row.qty=q.val;if(row.qty2!=null&&(row.qty==null||row.qty>=row.qty2))row.qty2=null;}
    row.unit=f.elements['u'+i].value;
    row.product=f.elements['p'+i].value.trim().toLowerCase();
    row.optional=f.elements['o'+i].checked;
  });
}
function renderReview(){
  const st=reviewState,r=S.recipes.find(x=>x.id===st.id);if(!r)return;
  const flaggedN=st.rows.filter(x=>rowFlags(x).length).length;
  let shown=0;
  const items=st.rows.map((row,i)=>{
    if(row.kind==='header')return st.only?'':`<li class="ingh">${esc(row.raw)}</li>`;
    if(row.kind==='note')return st.only?'':`<li class="hint" style="list-style:none;padding:4px 2px">${esc(row.raw)}</li>`;
    const fl=rowFlags(row);if(st.only&&!fl.length)return '';

    const choices=UNIT_CHOICES.some(([v])=>v===(row.unit||''))?UNIT_CHOICES:[...UNIT_CHOICES,[row.unit,row.unit]];
    return `<li class="ingrow${fl.length?' flag':''}"><div class="raw">${esc(row.raw)}${fl.length?`<span class="why">${esc(fl.join(', '))}</span>`:''}</div>
      <div class="ctl"><input name="q${i}" type="text" inputmode="decimal" aria-label="Hoeveelheid van ${esc(row.raw)}" placeholder="–" value="${row.qty!=null?esc(fmtNum(row.qty)):''}"><select name="u${i}" aria-label="Eenheid van ${esc(row.raw)}">${choices.map(([v,l])=>`<option value="${esc(v)}"${(row.unit||'')===v?' selected':''}>${esc(l)}</option>`).join('')}</select><input name="p${i}" list="prodList" aria-label="Product van ${esc(row.raw)}" placeholder="product" value="${esc(row.product||'')}" autocapitalize="off"></div>
      <label class="optl"><input type="checkbox" name="o${i}"${row.optional?' checked':''}> optioneel${row.note?` <span class="hint" style="margin:0 0 0 6px">(${esc(row.note)})</span>`:''}</label></li>`;
  }).join('');
  openSheet(`<h2>Ingrediënten controleren</h2><p class="hint" style="margin:2px 0 4px"><b>${esc(r.title)}</b></p>
  <p class="hint">Elke regel is omgezet naar hoeveelheid, eenheid en product. Het product gebruikt de app voor “Kan ik maken” en de boodschappenlijst. Laat het product leeg om een regel te negeren.</p>
  <div class="chips wrapchips" style="padding-top:0"><button class="chip" data-a="ing-only" aria-pressed="${st.only}">Alleen twijfelgevallen (${flaggedN})</button></div>
  <form id="ingForm"><datalist id="prodList">${productSuggestions().map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>
  <ul class="list">${items}${st.only&&!shown?'<li class="hint" style="list-style:none">Geen twijfelgevallen meer. Zet “Alleen twijfelgevallen” uit om alles te zien.</li>':''}</ul>
  <div class="actions"><button class="btn primary" type="submit">Opslaan</button><button class="btn" type="button" data-a="close">Annuleren</button><span class="spacer"></span><button class="btn small" type="button" data-a="ing-reset">Opnieuw herkennen</button></div></form>`);
}
async function saveReview(){
  const st=reviewState,f=$('#ingForm'),r=st&&S.recipes.find(x=>x.id===st.id);if(!r||!f)return;
  for(let i=0;i<st.rows.length;i++){
    const el=f.elements['q'+i];
    if(el&&!parseQtyInput(el.value).ok){toast('Hoeveelheid niet herkend. Gebruik bijvoorbeeld 250, 1,5 of ½.');el.focus();return;}
  }
  syncReview();
  st.rows.forEach(row=>{if(row.kind==='ing')row.ok=true;});
  S.ing[r.id]={h:ensureModel(r).h,rows:st.rows};S.ingV++;
  await saveModel(r);reviewState=null;closeSheet();render();toast('Ingrediënten opgeslagen');
}
function flagList(){

function iconHtml(id,cls){
  return `<svg class="pi${cls?' '+cls:''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_SVG[id]||ICON_SVG['📦']}</svg>`;
}

/* --- item detail menu --- */
const COUNT_UNITS=['stuks','pak','blik','fles','pot','zak','tube','rol'];
const SVG_PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5a2.1 2.1 0 0 1 3 3L8 19z"/></svg>';
const SVG_PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
const SVG_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SVG_BIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
function longDateTime(ms){
  try{const d=new Date(ms);return d.toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'})+' om '+d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return fmtDate(isoFromMs(ms));}
}
function itemDetail(id){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  const sec=secOf(it);
  let k1,v1,s1='',c1='';
  if(sec==='eten'){const e=expState(it);k1='THT-datum';v1=it.expiry?fmtDate(it.expiry):'Geen';s1=e.t;c1=e.s;}
  else if(sec==='verzorging'){k1='Koopdatum';v1=it.bought?fmtDate(it.bought):'Onbekend';const d=it.bought?-daysUntil(it.bought):null;s1=d!==null&&d>=0?agoText(d):'';}
  else{k1='Soort';v1=SECTIONS.find(s=>s.id===sec).label;}
  const foot=[it.added?`Toegevoegd op ${longDateTime(it.added)}`:'',it.barcode?`code ${it.barcode}`:''].filter(Boolean).join(' · ');
  const partial=COUNT_UNITS.includes(it.unit||'stuks')&&(+it.qty||0)>1;
  openSheet(`<div class="dtop"><h2>${esc(it.name)}</h2><button class="x" data-a="close" aria-label="Sluiten">✕</button></div>
  ${it.brand?`<p class="hint" style="margin:0">${esc(it.brand)}</p>`:''}
  <div class="dhead"><div class="dimg" aria-hidden="true">${iconHtml(iconFor(it))}</div>
    <div class="dgrid">
      <div><div class="k">${k1}</div><div class="v">${esc(v1)}</div>${s1?`<div class="s ${c1}">${esc(s1)}</div>`:''}</div>
      <div><div class="k">Categorie</div><div class="v">${esc(it.category||'Overig')}</div></div>
      <div><div class="k">Aantal</div><div class="v">${esc(fmtQty(it))}</div></div>
      <div><div class="k">Inhoud</div><div class="v">${esc(it.size||'–')}</div></div>
    </div></div>
  <div class="dbtns"><button class="dbtn" data-a="edit-item" data-id="${esc(it.id)}">${SVG_PEN}Bewerken</button><button class="dbtn" data-a="readd-item" data-id="${esc(it.id)}">${SVG_PLUS}Opnieuw toevoegen</button></div>
  <div class="dlabel">Afboeken${partial?' (1 stuk)':''}</div>
  <div class="dbtns" style="margin-top:0"><button class="dbtn good" data-a="writeoff" data-as="gebruikt" data-id="${esc(it.id)}">${SVG_CHECK}Gebruikt</button><button class="dbtn bad" data-a="writeoff" data-as="weggegooid" data-id="${esc(it.id)}">${SVG_BIN}Weggegooid</button></div>
  ${foot?`<p class="dfoot">${esc(foot)}</p>`:''}
  <button class="dlink" data-a="del-wrong" data-id="${esc(it.id)}">Verwijderen (verkeerd ingevoerd)</button>`);
}
async function writeOff(id,as){
  const it=S.items.find(x=>x.id===id);if(!it)return;
  const snapshot={...it},q=+it.qty||0;
  const partial=COUNT_UNITS.includes(it.unit||'stuks')&&q>1;
  if(partial){it.qty=q-1;await DB.put('items',it);}
  else{S.items=S.items.filter(x=>x.id!==id);await DB.del('items',id);}
  const entry={id:uid(),name:it.name,icon:iconFor(snapshot),section:secOf(it),as,at:Date.now(),qty:partial?1:q,unit:it.unit||'stuks'};
  S.log.push(entry);if(S.log.length>300)S.log=S.log.slice(-300);
  await saveSettings();closeSheet();render();
  toast(`${it.name}: ${as}${partial?' (1 stuk)':''}`,async()=>{
    const cur=S.items.find(x=>x.id===id);
    if(cur){cur.qty=snapshot.qty;await DB.put('items',cur);}else{S.items.push(snapshot);await DB.put('items',snapshot);}
    S.log=S.log.filter(e=>e.id!==entry.id);await saveSettings();render();toast('Afboeking ongedaan gemaakt');
  });
}

  $('#manualBar').addEventListener('submit',e=>{e.preventDefault();handleCode($('#barIn').value);});
  try{

    const F=Html5QrcodeSupportedFormats;
    scanner=new Html5Qrcode('scanBox',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],useBarCodeDetectorIfSupported:true,verbose:false});
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:150}},txt=>handleCode(txt),()=>{});

async function handleCode(raw){
  if(scanBusy)return;
  const code=String(raw||'').replace(/\D/g,'');
  if(code.length<8){toast('Dat is geen geldige barcode');return;}
  scanBusy=true;
  const msg=$('#scanMsg');if(msg)msg.textContent='Product zoeken…';
  const ex=S.items.find(i=>i.barcode===code);
  await stopScan();
  if(ex){closeSheet();itemForm({...ex,qty:(+ex.qty||0)+(stepFor(ex.unit)>=1?1:stepFor(ex.unit))},true,true);toast('Staat al in je voorraad: aantal +1, tik op Opslaan');return;}
  let p=null;
  const doms=S.section==='eten'?['openfoodfacts','openbeautyfacts','openproductsfacts']:S.section==='verzorging'?['openbeautyfacts','openfoodfacts','openproductsfacts']:['openproductsfacts','openbeautyfacts','openfoodfacts'];
  for(const d of doms){
    try{
      const r=await fetch(`https://world.${d}.org/api/v2/product/${code}.json?fields=product_name,product_name_nl,generic_name_nl,brands,quantity,categories_tags`);
      const j=await r.json();
      if(j&&j.status===1&&j.product){p=j.product;p._src=d;break;}
    }catch(e){}
  }
  closeSheet();
  if(p){
    const name=(p.product_name_nl||p.product_name||p.generic_name_nl||'').trim();
    const sec=(S.section==='eten'&&p._src==='openbeautyfacts')?'verzorging':(S.section==='eten'&&p._src==='openproductsfacts')?'overig':S.section;
    if(sec!==S.section){S.section=sec;S.cat='';}
    itemForm({name,brand:(p.brands||'').split(',')[0].trim(),size:p.quantity||'',qty:1,unit:'stuks',section:sec,category:sec==='eten'?guessCategory(p.categories_tags):guessCatIn(sec,name),barcode:code,expiry:''},true);
    if(!name)toast('Geen naam gevonden, vul die zelf in');
  }else{
    itemForm(newItem({name:'',barcode:code}),true);
    toast('Product niet gevonden of geen internet. Vul de naam zelf in; de barcode wordt onthouden.');
  }
}

function makeThumb(b64){return new Promise(res0=>{let done=false;const timer=setTimeout(()=>res(null),5000);const res=v=>{if(done)return;done=true;clearTimeout(timer);res0(v);};const img=new Image();
  img.onload=()=>{try{const s=Math.min(1,200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));}catch(e){res(null)}};
  img.onerror=()=>res(null);img.src=`data:${mimeOf(b64)};base64,${b64}`;});}

async function importRecipes(file){
  if(!window.JSZip&&!/\.melarecipe$/i.test(file.name)){toast('Kon het importbestand niet lezen: JSZip is niet geladen (geen internet?)');return;}
  toast('Importeren…');
  const texts=[];
  try{
    if(/\.melarecipe$/i.test(file.name))texts.push(await file.text());
    else{const zip=await JSZip.loadAsync(file);for(const f of Object.values(zip.files)){if(!f.dir&&/\.melarecipe$/i.test(f.name))texts.push(await f.async('string'));}}
  }catch(e){toast('Dit bestand is geen geldige Mela-export');return;}
  const recs=[];let bad=0;
  for(const t of texts){try{
    const d=JSON.parse(t);if(!d||typeof d!=='object'||!d.title){bad++;continue;}
    if(!d.id)d.id=uid();
    if(!Array.isArray(d.categories))d.categories=[];
    if(!Array.isArray(d.images))d.images=[];
    if(typeof d.ingredients!=='string')d.ingredients=Array.isArray(d.ingredients)?d.ingredients.join('\n'):'';
    if(typeof d.instructions!=='string')d.instructions='';
    recs.push(d);
  }catch(e){bad++}}
  if(!recs.length){toast('Geen recepten gevonden in dit bestand');return;}
  let added=0,updated=0;
  for(const d of recs){const i=S.recipes.findIndex(x=>x.id===d.id);if(i>=0){S.recipes[i]=d;updated++;}else{S.recipes.push(d);added++;}}
  await DB.putMany('recipes',recs);
  let flaggedN=0;for(const d of recs){ensureModel(d);flaggedN+=flaggedCount(d);}
  render();
  toast(`${added} nieuw, ${updated} bijgewerkt${bad?`, ${bad} overgeslagen`:''}. ${flaggedN?`${flaggedN} ingrediënten om te controleren (Meer → Ingrediënten).`:'Alle ingrediënten herkend.'}`);
  let n=0;const th=[];
  for(const d of recs){if(d.images&&d.images[0]){const t=await makeThumb(d.images[0]);if(t){S.thumbs[d.id]=t;th.push({id:d.id,data:t});}}
    if(++n%10===0&&(S.view==='recepten'||S.view==='koken'))render();}
  await DB.putMany('thumbs',th.map(x=>({id:x.id,data:x.data})));
  render();
}

    case 'readd-item':{const it=S.items.find(i=>i.id===id);if(it)itemForm({...it,id:undefined,added:undefined,expiry:'',bought:todayStr(),qty:1},true);break;}
    case 'writeoff':writeOff(id,b.dataset.as);break;
    case 'del-wrong':{const it=S.items.find(i=>i.id===id);if(it&&confirm(`${it.name} verwijderen? Gebruik dit alleen voor een product dat je verkeerd hebt ingevoerd.`)){S.items=S.items.filter(i=>i.id!==id);await DB.del('items',id);closeSheet();render();toast('Verwijderd');}break;}
    case 'edit-item':{const it=S.items.find(i=>i.id===id);if(it)itemForm(it,false);break;}
    case 'del-item':{const it=S.items.find(i=>i.id===id);if(it&&confirm(`${it.name} verwijderen?`)){S.items=S.items.filter(i=>i.id!==id);await DB.del('items',id);closeSheet();render();toast('Verwijderd');}break;}
    case 'inc':changeQty(id,1);break;
    case 'dec':changeQty(id,-1);break;
    case 'cat':S.cat=b.dataset.c;render();break;
    case 'filter':S.filterOpen=!S.filterOpen;render();break;
    case 'add-menu':addMenu();break;
    case 'add-scan':startScan();break;
    case 'add-manual':itemForm(newItem(),true);break;
    case 'set-sort':S.sort=b.dataset.v;render();break;
    case 'reset-filter':S.cat='';S.sort=SORTS[S.section][0][0];render();break;
    case 'q-inc':case 'q-dec':{const inp=$('#f-qty'),st=stepFor($('#f-unit').value);inp.value=Math.max(0,Math.round(((parseFloat(inp.value)||0)+(a==='q-inc'?st:-st))*100)/100);break;}
    case 'rcat':S.rcat=b.dataset.c;render();break;
    case 'cook':S.cook=b.dataset.v;render();break;
    case 'exp-add':{const f=$('#f-exp');const d=+b.dataset.d;f.value=d?fmtDate(addDays(d)):'';break;}
    case 'open-recipe':recipeDetail(id);break;
    case 'new-recipe':recipeForm(null);break;
    case 'edit-recipe':recipeForm(S.recipes.find(r=>r.id===id));break;
    case 'del-recipe':{const r=S.recipes.find(x=>x.id===id);if(r&&confirm(`“${r.title}” verwijderen?`)){S.recipes=S.recipes.filter(x=>x.id!==id);delete S.thumbs[id];delete S.ing[id];await DB.del('meta','ing:'+id);if(S.ratings[id]){delete S.ratings[id];await saveSettings();}await DB.del('recipes',id);await DB.del('thumbs',id);closeSheet();render();toast('Recept verwijderd');}break;}
    case 'toggle-ing':{
      const k=b.dataset.k,auto=b.dataset.auto;const cur=S.overrides[k]||(auto==='missing'?'missing':'have');
      const next=cur==='have'?'missing':'have';
      const autoSide=auto==='missing'?'missing':'have';
      if(next===autoSide)delete S.overrides[k];else S.overrides[k]=next;
      await saveSettings();recipeDetail(id);render();break;}
    case 'toggle-picker':{const pk=$('#picker');pk.hidden=!pk.hidden;if(!pk.hidden){$('#pgrid').innerHTML=pickerHtml($('#iconQ').value,$('#f-icon').value);}break;}
    case 'pick-icon':$('#f-icon').value=b.dataset.e;$('#picker').hidden=true;updateIconPrev();break;
    case 'icon-auto':$('#f-icon').value='';$('#picker').hidden=true;updateIconPrev();break;
    case 'rate':{const n=+b.dataset.n;if(S.ratings[id]===n)delete S.ratings[id];else S.ratings[id]=n;await saveSettings();recipeDetail(id);render();break;}
    case 'rtop':S.rtop=!S.rtop;render();break;
    case 'serv-inc':case 'serv-dec':{const r=S.recipes.find(x=>x.id===id);if(!r)break;const sv=servingsFor(r);S.servings[id]=Math.min(50,Math.max(1,sv.n+(a==='serv-inc'?1:-1)));await saveSettings();recipeDetail(id);break;}
    case 'serv-reset':{const r=S.recipes.find(x=>x.id===id);if(!r)break;S.servings[id]=servingsFor(r).base;await saveSettings();recipeDetail(id);break;}
    case 'save-defserv':{const v=parseInt($('#defServ').value,10);S.defaultServings=v>0?Math.min(50,v):null;await saveSettings();render();toast(S.defaultServings?`Standaard: ${S.defaultServings} personen`:'Recepten volgen weer hun eigen aantal');break;}
    case 'import-recipes':$('#recipeFile').value='';$('#recipeFile').click();break;
    case 'export-recipes':exportRecipes();break;
    case 'save-staples':S.staples=parseStaples($('#staples').value);await saveSettings();toast('Basisvoorraad opgeslagen');render();break;
    case 'reset-staples':S.staples=[...DEFAULT_STAPLES];await saveSettings();render();toast('Standaardlijst teruggezet');break;
    case 'export-stock':download(new Blob([JSON.stringify({type:'voorraadkast',version:2,items:S.items,settings:{ratings:S.ratings,servings:S.servings,defaultServings:S.defaultServings,staples:S.staples,log:S.log,shop:S.shop,plan:S.plan,ing:S.ing}},null,1)],{type:'application/json'}),'voorraad-backup.json');break;
    case 'import-stock':$('#stockFile').value='';$('#stockFile').click();break;
  }
}
document.addEventListener('click',e=>{handleClick(e).catch(showError);});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;render();}
  else if(e.target.id==='rq'){S.rq=e.target.value;render();}
  else if(e.target.id==='f-name')updateIconPrev();
  else if(e.target.id==='iconQ')$('#pgrid').innerHTML=pickerHtml(e.target.value,$('#f-icon').value);
  else if(e.target.id==='ppq')$('#ppl').innerHTML=pickList(e.target.value);
});
document.addEventListener('change',e=>{
  if(e.target.id==='sort'){S.sort=e.target.value;render();}
  else if(e.target.id==='rsort'){S.rsort=e.target.value;render();}
  else if(e.target.id==='f-cat')updateIconPrev();
  else if(e.target.id==='f-section')syncSection();
});
async function handleSubmit(e){
  const id=e.target.id;
  if(id==='shopAdd'){
    e.preventDefault();const v=$('#shopIn').value.trim();if(!v)return;
    addToShop(v.split(/\s*[;\n]\s*/).filter(Boolean).map(text=>({text})),'');
    await saveSettings();render();const i=$('#shopIn');if(i)i.focus();
  }else if(id==='shopForm'){
    e.preventDefault();
    const r=S.recipes.find(x=>x.id===e.target.dataset.id);
    const picked=[...e.target.querySelectorAll('input[name=p]:checked')].map(c=>shopParts[+c.value]);
    if(!picked.length){toast('Niets geselecteerd');return;}
    const n=addToShop(picked,r?r.title:'');await saveSettings();closeSheet();render();
    toast(`${n} ${n===1?'ingrediënt':'ingrediënten'} op de boodschappenlijst`);
  }else if(id==='ingForm'){e.preventDefault();saveReview();
  }else if(id==='planTextForm'){
    e.preventDefault();const t=$('#pt-in').value.trim();if(!t)return;
    await addPlanText(planTarget,t);closeSheet();render();toast(`Toegevoegd: ${t.toLowerCase()}`);
  }else if(id==='linkForm'){e.preventDefault();runLinkImport();}
  else if(id==='textForm'){e.preventDefault();runTextImport();}
}
document.addEventListener('submit',e=>{handleSubmit(e).catch(showError);});
$('#recipeFile').addEventListener('change',e=>{const f=e.target.files[0];if(f)importRecipes(f);});
$('#stockFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());const arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw 0;
    const clean=arr.filter(x=>x&&x.name&&!x.usedAt).map(mapImportItem);
    for(const it of clean){const i=S.items.findIndex(y=>y.id===it.id);if(i>=0)S.items[i]=it;else S.items.push(it);}
    await DB.putMany('items',clean);
    if(!Array.isArray(j)&&j.settings){const st=j.settings;
      if(st.ing&&typeof st.ing==='object'){for(const [rid,mm] of Object.entries(st.ing)){if(mm&&Array.isArray(mm.rows)&&!S.ing[rid]){S.ing[rid]={h:mm.h,rows:mm.rows};DB.put('meta',{key:'ing:'+rid,h:mm.h,rows:mm.rows});}}S.ingV++;}
      if(st.ratings)Object.assign(S.ratings,st.ratings);
      if(st.servings)Object.assign(S.servings,st.servings);
      if(st.defaultServings)S.defaultServings=st.defaultServings;
      if(Array.isArray(st.shop)){const ids=new Set(S.shop.map(e=>e.id));st.shop.forEach(e=>{if(e&&e.id&&!ids.has(e.id))S.shop.push(e);});}
      if(Array.isArray(st.plan)){const ids=new Set(S.plan.map(e=>e.id));st.plan.forEach(e=>{if(e&&e.id&&!ids.has(e.id))S.plan.push(e);});}
      if(Array.isArray(st.log)){const ids=new Set(S.log.map(e=>e.id));st.log.forEach(e=>{if(e&&e.id&&!ids.has(e.id))S.log.push(e);});}
      if(Array.isArray(st.staples)&&st.staples.length)S.staples=st.staples;
      await saveSettings();}
    render();toast(`${clean.length} producten teruggezet`);
  }catch(err){toast('Dit is geen geldige back-up');}
});

/* --- init --- */
(async function init(){
  const ok=await DB.open();
  if(ok){
    S.items=await DB.all('items');S.recipes=await DB.all('recipes');
    {const ch=migrateItems();if(ch.length)await DB.putMany('items',ch);}
    (await DB.all('thumbs')).forEach(t=>S.thumbs[t.id]=t.data);
    const metas=await DB.all('meta');const m=metas.find(x=>x.key==='settings');
    metas.filter(x=>String(x.key).startsWith('ing:')).forEach(x=>{S.ing[x.key.slice(4)]={h:x.h,rows:x.rows};});
    if(m){if(Array.isArray(m.staples))S.staples=m.staples;if(m.overrides)S.overrides=m.overrides;if(m.servings)S.servings=m.servings;if(m.ratings)S.ratings=m.ratings;if(Array.isArray(m.log))S.log=m.log;if(Array.isArray(m.shop))S.shop=m.shop;if(Array.isArray(m.plan))S.plan=m.plan;if(m.defaultServings)S.defaultServings=m.defaultServings;}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }else toast('Opslaan in de browser lukt niet (privémodus?). Je gegevens verdwijnen bij sluiten.');
  render();
})();
</script>
</body>
